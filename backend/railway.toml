# Authoritative Railway config for the GradeAI backend.
#
# Railway reads this file from the service's Root Directory, which must be set to
# `backend` (requirements.txt, main.py and Dockerfile live here). The repo-root
# railway.toml / Procfile are stale leftovers from an earlier repo-root layout and
# are ignored when Root Directory = backend.
#
# The builder is now `dockerfile`, not nixpacks. The paper generator typesets with
# a real XeLaTeX engine, and that engine has to be installed in the image along
# with a pre-warmed resource cache (see backend/Dockerfile — ~75 MB in total).
# nixpacks has no clean hook for that; the Dockerfile does it deterministically
# and the cache layer is baked in, which matters because Railway's filesystem is
# ephemeral and a cold container must not have to reach the network to render a
# paper.
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# No startCommand. The Dockerfile's CMD is the single source of truth for how the
# server starts. Defining it here as well meant two places had to agree about the
# port, and this one expands "$PORT" unquoted: if the platform has not set it the
# command becomes "... --port" with no argument, uvicorn exits immediately, and
# the deploy fails its healthcheck with nothing in the application log to say why.
healthcheckPath = "/health"
# Total window Railway waits for the container to report healthy, NOT a per-probe
# timeout. 30s was too tight: a cold container has to import firebase-admin,
# grpc, SQLAlchemy, reportlab, PyMuPDF, anthropic and the LaTeX package before
# uvicorn binds, which on a small instance can take well over half a minute. When
# the window expires Railway keeps the PREVIOUS container and the deploy looks
# like it simply never happened — the failure mode that hid the missing-module
# breakage in f024c12.
healthcheckTimeout = 300
restartPolicyType = "on_failure"
